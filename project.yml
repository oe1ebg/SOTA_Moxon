# Project descriptor for the oe1ebg.at project pages, read by
# scripts/stage_projects.py in oe1ebg/oe1ebg_at from the pinned release.
# The site merges it with its own projects/moxon.yml (release pin and the
# pages committed to the site, such as the overview and the calculator);
# where both set a value, the site's wins.
#
# Paths are relative to this repository. `source` is a Markdown file staged
# as the section's page; `parts` is generated from the freecad_tools export
# config. Export keys are the export names, body keys the FreeCAD body
# labels used in that config. Optional per export or body:
#   description: a short text shown with the part
#   printables: https://www.printables.com/model/…
title: Moxon
licence:
  name: CC BY-SA 4.0
  url: https://creativecommons.org/licenses/by-sa/4.0/

sections:
  theory:
    source: notebooks/moxon_theory.md
    description: How the Moxon rectangle works, its dimensions and limitations.
  build:
    source: TUNING.md
    title: Build and tuning
    description: Assemble the Moxon and tune it with a NanoVNA and the Smith chart.
  parts:
    config: .freecad_tools/config.yml
    description: The 3D-printed parts of the Moxon, to rotate in the browser and download.
    intro: >-
      Choose a part or a whole print plate, then drag to rotate it or pinch
      to zoom. The preview shows the geometry; use the downloaded files in
      your slicer.
    exports:
      Moxon_OE1EBG_BackT:
        title: Back T kit
    bodies:
      Feed001: {title: Feed point}
      Cover001: {title: Feed point cover}
      BackT: {title: Back T}
